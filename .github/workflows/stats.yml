name: Update GitHub Stats

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e
        with:
          card: stats

          options: '{"username":"${{ github.repository_owner }}","show_icons":true,"theme":"transparent","hide_border":true,"include_all_commits":true}'

          path: profile/stats.svg

          core_version: 2.1.3

          token: ${{ secrets.GH_STATS_TOKEN }}

          fail_on_error: true

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e
        with:
          card: top-langs

          options: '{"username":"${{ github.repository_owner }}","layout":"compact","langs_count":8,"theme":"transparent","hide_border":true}'

          path: profile/top-langs.svg

          core_version: 2.1.3

          token: ${{ secrets.GH_STATS_TOKEN }}

          fail_on_error: true

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          git diff --cached --quiet || \
            git commit -m "chore: update GitHub profile stats"

          git push