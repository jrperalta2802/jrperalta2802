name: Update GitHub Stats

on:
  schedule:
    # Runs every day at 00:30 UTC
    - cron: "30 0 * * *"

  # Allows manual execution from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # Checkout profile repository
      # -------------------------------------------------------
      - name: Checkout profile repository
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # Create directory for generated SVG files
      # -------------------------------------------------------
      - name: Create profile directory
        run: mkdir -p profile

      # -------------------------------------------------------
      # Generate main GitHub statistics
      # Includes private repository statistics using PAT
      # -------------------------------------------------------
      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e
        with:
          card: stats

          options: '{"username":"${{ github.repository_owner }}","show_icons":true,"card_width":500,"theme":"transparent","hide_border":true,"include_all_commits":true}'

          path: profile/stats.svg

          core_version: 2.1.3

          # PAT stored in:
          # Repository Settings
          # → Secrets and variables
          # → Actions
          # → GH_STATS_TOKEN
          token: ${{ secrets.GH_STATS_TOKEN }}

          fail_on_error: true

      # -------------------------------------------------------
      # Generate most-used languages
      # Includes private repository data accessible by PAT
      # -------------------------------------------------------
      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e
        with:
          card: top-langs

          options: '{"username":"${{ github.repository_owner }}","layout":"compact","langs_count":6,"card_width":500,"theme":"transparent","hide_border":true}'

          path: profile/top-langs.svg

          core_version: 2.1.3

          token: ${{ secrets.GH_STATS_TOKEN }}

          fail_on_error: true

      # -------------------------------------------------------
      # Commit regenerated SVG files
      # -------------------------------------------------------
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No stats changes to commit."
          else
            git commit -m "chore: update GitHub profile stats"
            git push
          fi